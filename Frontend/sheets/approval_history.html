<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Histórico de decisiones</title>
  <link href="../css/template.css" rel="stylesheet">
  <link href="../css/risk_list.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>

<body>
  <nav class="sidebar">
    <div class="logo-container">
      <img src="../assets/parere_sin_fondo.png" alt="Parere GRC Logo" class="logo">
    </div>
    <ul class="menu">
    </ul>
    <ul class="bottom-menu">
    </ul>
  </nav>
  <div class="content">

    <main class="risk-container">
      <h1>Histórico de decisiones</h1>
      <div style="width:92%;margin:0 auto 20px auto;display:flex;justify-content:end;">
        <input type="text" id="approval-search-input" placeholder="Busqueda de proveedor"
          style="padding:8px 14px;border-radius:6px;border:1px solid #ccc;width:320px;max-width:100%;font-size:14px;">
      </div>
      <section class="risk-table-section">
        <table class="general-table" id="approval-table">
          <thead>
            <tr>
              <th>Proveedor</th>
              <th>Id</th>
              <th>Fecha de detección</th>
              <th>Fecha de aprobación</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="approval-table-body">
            <tr>
              <td colspan="7" style="text-align:center;">Cargando histórico de decisiones...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

  </div>
  <script src="../js/config.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/approval_history.js"></script>
</body>

</html>
