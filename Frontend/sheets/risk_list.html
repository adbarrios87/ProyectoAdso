<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Parere GRC - Analista de Riesgos </title>
  <link href="../css/template.css" rel="stylesheet">
  <link href="../css/risk_list.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>

<body>
  <nav class="sidebar">
    <div class="logo-container">
      <img src="../assets/parere_sin_fondo.png" alt="Parere GRC Logo" class="logo">
    </div>
    <ul class="menu">
    </ul>

    <ul class="bottom-menu">
    </ul>
  </nav>

  <div class="content">


    <main class="risk-container">
      <h1>Panel de Riesgos</h1>
      <div class="risk-style">
        <p class="risk-description">Novedades reportadas en el sistema</p>
        <input type="text" class="search-input" id="risk-search-input" placeholder="Busqueda de proveedor">
      </div>

      <section class="risk-table-section">
        <table class="general-table" id="risk-table">
          <thead>
            <tr>
              <th>Proveedor</th>
              <th>NIT / Documento</th>
              <th>Estado</th>
              <th>Fecha de detección</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="6" style="text-align:center;">Cargando proveedores...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>


  </div>
  <script src="../js/config.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/risk_list.js"></script>
</body>

</html>
