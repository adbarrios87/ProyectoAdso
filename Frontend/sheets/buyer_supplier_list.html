<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Parere GRC - Lista de proveedores</title> <!--Cambiar el titulo aqui según la pagina-->
  <link href="../css/template.css" rel="stylesheet">
  <link href="../css/buyer_supplier_list.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>

  <nav class="sidebar"> <!-- Aquí la navegación principal -->
    <div class="logo-container">
      <img src="../assets/parere_sin_fondo.png" alt="Parere GRC Logo" class="logo">
    </div>
    <ul class="menu">
    </ul>
    <ul class="bottom-menu">
    </ul>
  </nav>

  <div class="content">

    <main>
      <section class="filter-section">
        <div class="filters-container">
          <div class="filter-item" style="flex: 2; min-width: 280px;">
            <label for="searchInput">Buscador</label>
            <div class="search-input-group">
              <i class="fas fa-search"></i>
              <input type="text" id="searchInput" placeholder="Buscar por nombre, NIT, estado u otro..."
                oninput="buscarProveedores()">
            </div>
          </div>
          <div class="filter-item">
            <label for="tipoFecha">Filtrar por</label>
            <select id="tipoFecha" onchange="buscarProveedores()">
              <option value="registro">Fecha de registro</option>
              <option value="actualizacion">Fecha de actualización</option>
              <option value="calificacion">Fecha de calificación</option>
            </select>
          </div>
          <div class="filter-item date-range">
            <label for="fechaInicio">Desde</label>
            <input type="date" id="fechaInicio" oninput="buscarProveedores()">
          </div>
          <div class="filter-item date-range">
            <label for="fechaFin">Hasta</label>
            <input type="date" id="fechaFin" oninput="buscarProveedores()">
          </div>
        </div>
      </section>

      <section class="results-section">
        <table class="general-table">
          <thead>
            <tr>
              <th>Nit</th>
              <th>Nombre/Razón Social</th>
              <th>Contacto</th>
              <th>Teléfono</th>
              <th>Estado</th>
              <th>Calificación</th>
              <th>Bienes/Servicios que provee</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="resultados"></tbody>
        </table>
      </section>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/buyer_supplier_list.js"></script>
</body>

</html>
