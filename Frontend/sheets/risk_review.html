<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Parere GRC - Template </title> <!--Cambiar el titulo aqui según la pagina-->
  <link href="../css/template.css" rel="stylesheet">
  <link href="../css/risk_review.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>

<body>

  <nav class="sidebar"> <!-- Aquí la navegación principal -->
    <div class="logo-container">
      <img src="../assets/parere_sin_fondo.png" alt="Parere GRC Logo" class="logo">
    </div>
    <ul class="menu">
    </ul>

    <ul class="bottom-menu">
    </ul>
  </nav>

  <div class="content">


    <main class="review-container">
      <div class="review-header">
        <h1>Revisión de Riesgos - Proveedor</h1>
        <p>Analiza las coincidencias detectadas y registra tus observaciones</p>
      </div>

      <!-- Información básica del proveedor -->
      <section class="supplier-info">
        <h2>Información del proveedor</h2>
        <div class="info-grid">

        </div>
      </section>

      <div class="validation-matrix-container" style="overflow-x: auto; margin-top: 15px; margin-bottom: 25px;">
        <table class="general-table matrix-table" style="width: 100%; border-collapse: collapse; text-align: center;">
          <thead>
            <tr>
              <th style="text-align: left;">Campo de Revisión</th>
              <th>RUT</th>
              <th>Cámara de Comercio</th>
              <th>Referencia Comercial</th>
              <th>Certificación Bancaria</th>
              <th>Cédula</th>
            </tr>
          </thead>
          <tbody id="tbody-validation-matrix">
            <tr>
              <td colspan="6" style="text-align:center;">Cargando matriz de validaciones...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Observaciones -->
      <section class="risk-observations">
        <h2>Observaciones del analista de riesgos</h2>
        <textarea placeholder="Escribe aquí tus comentarios y conclusiones sobre el análisis de riesgo..."></textarea>

        <div class="form-group" style="margin-top: 15px; display: flex; flex-direction: column; gap: 5px;">
          <label for="risk-decision-select" style="font-weight: 600; font-size: 14px; color: #2c3e50;">Decisión de
            Riesgos:</label>
          <select id="risk-decision-select"
            style="padding: 10px; width: 100%; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 13px;"
            required>
            <option value="">Seleccione una opción...</option>
            <option value="10">⚠️ Revisado con novedad</option>
            <option value="8">🔴 Rechazado por novedad</option>
          </select>
        </div>
      </section>

      <!-- Acciones finales -->
      <div class="review-actions">
        <button class="btn">Cancelar</button>
        <button class="btn">Guardar revisión</button>
      </div>
    </main>


    <script src="../js/config.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/risk_review.js"></script>
</body>

</html>
