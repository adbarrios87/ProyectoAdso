<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Parere GRC - Restablecer Contraseña</title>
  <link href="../css/login.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>  
  <div class="login-container">
    <!-- Lado izquierdo: Branding (Mismo de login.html) -->
    <div class="left-side">
      <div class="brand-content">
        <img src="../assets/parere_sin_fondo.png" alt="Parere GRC Logo" class="brand-logo">
        <p class="tagline">Validación Ética de Proveedores</p>
        <div class="brand-features">
          <div class="feature"><i class="fa-solid fa-shield-halved"></i><span>Gestión de Riesgo</span></div>
          <div class="feature"><i class="fa-solid fa-scale-balanced"></i><span>Cumplimiento Normativo</span></div>
          <div class="feature"><i class="fa-solid fa-check-double"></i><span>Validación Integral</span></div>
        </div>
      </div>
      <div class="brand-footer">
        <p>© 2025 Juan Cadena, Adriana Barrios</p>
      </div>
    </div>

    <!-- Lado derecho: Formulario de Restablecimiento -->
    <div class="right-side">
      <div class="login-card">
        <div class="login-header">
          <h2>Crea una nueva contraseña</h2>
          <p>Ingresa tu nueva contraseña y confírmala para actualizar tu acceso.</p>
        </div>
        <form class="reset-form">
          <div class="input-group">
            <label for="password">Nueva contraseña</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="password" name="password" placeholder="Nueva contraseña (mínimo 6 caracteres)" required>
            </div>
          </div>

          <div class="input-group">
            <label for="confirm-password">Confirmar nueva contraseña</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-circle-check"></i>
              <input type="password" id="confirm-password" name="confirm-password" placeholder="Repite tu nueva contraseña" required>
            </div>
          </div>

          <button type="submit" class="btn-login" style="margin-bottom: 20px;">
            <i class="fa-solid fa-key"></i> Actualizar contraseña
          </button>
        </form>

        <div class="options-row" style="justify-content: center; margin-bottom: 0;">
          <a href="../../login.html" class="forgot-link">
            <i class="fa-solid fa-arrow-left"></i> Volver al inicio de sesión
          </a>
        </div>
      </div>
    </div>
  </div>
  
  <script src="../js/config.js"></script>
  <script src="../js/reset_password.js"></script>
</body>
</html>
