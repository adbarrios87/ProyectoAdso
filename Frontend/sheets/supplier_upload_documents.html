<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Envío de Documentos - Parere GRC</title> <!--Cambiar el titulo aqui según la pagina-->
  <link href="../css/template.css" rel="stylesheet">
  <link href="../css/supplier_upload_documents.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

</head>

<body>

  <nav class="sidebar"> <!-- Aquí la navegación principal -->
    <div class="logo-container">
      <a href="#" id="logo-link">
        <img src="../assets/parere_sin_fondo.png" alt="Parere GRC Logo" class="logo">
      </a>
    </div>
    <ul class="menu">
    </ul>

    <ul class="bottom-menu">
    </ul>
  </nav>

  <div class="content">

    <main class="upload-container">
      <div class="company-info">
        <h1>Envío de Documentos</h1>
        <p>Asegúrate de cargar versiones actualizadas en formato PDF o imagen.</p>
      </div>

      <section class="upload-section">
        <div class="table-container">
          <table class="general-table">
            <thead>
              <tr>
                <th>Documento Obligatorio</th>
                <th>Seleccionar Archivo</th>
                <th>Estado</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="documentsTableBody">
            </tbody>
          </table>
        </div>

        <div class="actions-footer">
          <button class="btn btn-primary" onclick="enviarTodo()">
            <i class="fa-solid fa-cloud-arrow-up"></i> Finalizar y Enviar todo el expediente
          </button>
        </div>
      </section>
    </main>



  </div>
  <script src="../js/config.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/supplier_upload_documents.js"></script>
</body>

</html>
