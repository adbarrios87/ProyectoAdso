<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Historial de Calificaciones - Parere GRC</title> <!--Cambiar el titulo aqui según la pagina-->
  <link href="../css/template.css" rel="stylesheet">
  <link href="../css/supplier_qualification_history.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>

<body>

  <nav class="sidebar"> <!-- Aquí la navegación principal -->
    <div class="logo-container">
      <img src="../assets/parere_sin_fondo.png" alt="Parere GRC Logo" class="logo">
    </div>
    <ul class="menu">
    </ul>

    <ul class="bottom-menu">
    </ul>
  </nav>
  <div class="content">
    <main class="history-container">
      <div class="company-info">
        <h1>Historial de Calificaciones</h1>
        <p>Resumen detallado del desempeño comercial en <strong>Parere GRC</strong>.</p>
      </div>

      <div class="filter-section">
        <div class="filter-group">
          <label for="yearFilter"><i class="fa-solid fa-calendar-days"></i> Filtrar por año:</label>
          <select id="yearFilter" onchange="filterByYear()">
            <option value="all">Todos los años</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
          </select>
        </div>
      </div>

      <div class="table-container">
        <table class="general-table">
          <thead>
            <tr>
              <th>Periodo Evaluado</th>
              <th>Puntaje</th>
              <th>Nivel de Confianza</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="history-tbody">
            <tr>
              <td colspan="4" style="text-align: center;">Cargando historial de calificaciones...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/main.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="../js/supplier_qualification_history.js"></script>
</body>

</html>
