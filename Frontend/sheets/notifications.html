<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Notificaciones - Parere GRC</title>
  <link href="../css/template.css" rel="stylesheet">
  <link href="../css/notifications.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>

<body>

  <nav class="sidebar">
    <div class="logo-container">
      <img src="../assets/parere_sin_fondo.png" alt="Parere GRC Logo" class="logo">
    </div>
    <ul class="menu">
    </ul>

    <ul class="bottom-menu">
    </ul>
  </nav>

  <div class="content">

    <main class="notifications-container">
      <div class="company-info">
        <h1>Centro de Notificaciones</h1>
        <p>Mantente al día con las alertas y actualizaciones de tu cuenta en <strong>Parere GRC</strong>.</p>
      </div>

      <section class="notifications-list">
        <div class="table-container">
          <table class="general-table">
            <thead>
              <tr>
                <th style="width: 150px;">Fecha</th>
                <th style="width: 200px;">Tipo de Alerta</th>
                <th>Mensaje</th>
                <th style="width: 120px;" class="number">Estado</th>
              </tr>
            </thead>
            <tbody id="notifications-body">
              <!-- Carga dinámica -->
            </tbody>
          </table>
        </div>
      </section>
    </main>


    <script src="../js/config.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/notifications.js"></script>
</body>

</html>
