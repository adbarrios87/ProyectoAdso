<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Histórico de Decisiones - Oficial de Cumplimiento</title>
  <link href="../css/template.css" rel="stylesheet">
  <link href="../css/compliance_officer_history.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>

  <nav class="sidebar">
    <div class="logo-container">
      <img src="../assets/parere_sin_fondo.png" alt="Parere GRC Logo" class="logo">
    </div>
    <ul class="menu">
    </ul>
    <ul class="bottom-menu">
    </ul>
  </nav>

  <div class="content">
    <main class="history-container">
      <div class="history-header">
        <h1> Histórico de aprobaciones</h1>
        <div class="stats-row" style="margin-bottom: 0;">
          <div class="stat-item">
            <div class="stat-info">
              <span class="stat-value" id="kpi-approved">0</span>
              <span class="stat-label">Aprobados</span>
            </div>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <div class="stat-info">
              <span class="stat-value" id="kpi-rejected">0</span>
              <span class="stat-label">Rechazados</span>
            </div>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <div class="stat-info">
              <span class="stat-value" id="kpi-alerts">0</span>
              <span class="stat-label">Con alerta de riesgo</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Filtros + Buscador -->
      <div class="filters-stats-container">
        <div class="filters-row">
          <!-- Live Search Bar -->
          <div class="filter-group search-group">
            <div class="search-input-wrapper">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="history-search-input" placeholder="Buscar proveedor...">
            </div>
          </div>

          <!-- Fecha Desde -->
          <div class="filter-group date-group">
            <label>Fecha Desde</label>
            <input type="date" id="filterDateFrom" onchange="filtrarDecisiones()">
          </div>

          <!-- Fecha Hasta -->
          <div class="filter-group date-group">
            <label>Fecha Hasta</label>
            <input type="date" id="filterDateTo" onchange="filtrarDecisiones()">
          </div>

          <!-- Botón Limpiar -->
          <button class="btn" onclick="limpiarFiltros()">
            Limpiar
          </button>
        </div>
      </div>

      <!-- Tabla de decisiones -->
      <div class="table-container">
        <table class="general-table" id="decisionsTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Fecha</th>
              <th>Proveedor</th>
              <th>NIT</th>
              <th>Decisión</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="decisionsBody">
            <!-- Las decisiones se cargan dinámicamente desde localStorage -->
          </tbody>
        </table>
      </div>

      <!-- Mensaje cuando no hay decisiones -->
      <div class="no-decisions" id="noDecisions" style="display: none;">
        <i class="fa-solid fa-folder-open"></i>
        <h3>No hay decisiones registradas</h3>
        <p>Las decisiones que tomes en la revisión de proveedores aparecerán aquí.</p>
      </div>

    </main>


    <script src="../js/config.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/compliance_officer_history.js"></script>
</body>

</html>
