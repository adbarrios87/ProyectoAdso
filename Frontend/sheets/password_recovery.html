<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Golden olds - Template </title> <!--Cambiar el titulo aqui según la pagina-->
 
  <link href="../css/password_recovery.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>  
   <header>
    <div class="logo-container">
      <img src="../assets/parere_sin_fondo.png" alt="Parere GRC Logo" class="logo">
    </div>
  </header>

 <main class="password-recovery">

  <div class="recovery-container">
    <h2>¿Olvidaste tu contraseña?</h2>
    <p>Ingresa tu correo electrónico registrado. Te enviaremos un enlace para restablecer tu contraseña.</p>

    <form class="recovery-form">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>

      <button type="submit" class="btn-send"><i class="fa-solid fa-envelope"></i> Enviar enlace</button>
    </form>

    <div class="recovery-hint">
      <a href="login.html"><i class="fa-solid fa-arrow-left"></i> Volver al inicio de sesión</a>
    </div>
  </div>
</main>

  <footer>
    <p>Copyright © 2025 Juan Cadena, Adriana Barrios</p>
  </footer>
  <script src="../js/password_recovery.js"></script>
</body>
</html>
