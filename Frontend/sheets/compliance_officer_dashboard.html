<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Parere GRC - Cumplimiento </title>
  <link href="../css/template.css" rel="stylesheet">
  <link href="../css/compliance_officer_dashboard.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>

<body>

  <nav class="sidebar">
    <div class="logo-container">
      <img src="../assets/parere_sin_fondo.png" alt="Parere GRC Logo" class="logo">
    </div>
    <ul class="menu">
    </ul>
    <ul class="bottom-menu">
    </ul>
  </nav>

  <div class="content">
    <main class="dashboard-container">
      <div class="dashboard-header">
        <h1> Dashboard de Cumplimiento</h1>
        <div class="stats-row" style="margin-bottom: 0;">
          <div class="stat-item">
            <div class="stat-info">
              <span class="stat-value" id="kpi-approved">0</span>
              <span class="stat-label">Aprobados</span>
            </div>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <div class="stat-info">
              <span class="stat-value" id="kpi-rejected">0</span>
              <span class="stat-label">Rechazados</span>
            </div>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <div class="stat-info">
              <span class="stat-value" id="kpi-alerts">0</span>
              <span class="stat-label">Con alerta de riesgo</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabla de proveedores pendientes de revision -->
      <section class="pending-review-section">
        <h2> Proveedores pendientes de revisión</h2>
        <table class="general-table">
          <thead>
            <tr>
              <th>Proveedor</th>
              <th>ID</th>
              <th>Estado</th>
              <th>Fecha de deteccion</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tbody-compliance-list">
            <tr>
              <td colspan="5" style="text-align:center;">Cargando proveedores...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/compliance_officer_dashboard.js"></script>
</body>

</html>
