<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Parere GRC - Nuevo usuario </title>
  <link href="../css/template.css" rel="stylesheet">
  <link href="../css/user_new.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>

<body>

  <nav class="sidebar">
    <div class="logo-container">
      <a href="#" id="logo-link">
        <img src="../assets/parere_sin_fondo.png" alt="Parere GRC Logo" class="logo">
      </a>
    </div>
    <ul class="menu"></ul>
    <ul class="bottom-menu"></ul>
  </nav>

  <div class="content">

    <main>
      <section class="user-form-section">
        <h2>Registro de Usuario</h2>
        <p class="form-note">Los campos marcados con (*) son obligatorios</p>

        <form class="user-form" action="#" method="post" autocomplete="off">

          <div class="form-row">

            <div class="form-group">
              <label for="role" class="visually-hidden">Rol</label>
              <select id="role" name="role" required>
                <option value="">Seleccione un rol</option>
              </select>
            </div>

            <div class="form-group" id="position-container">
              <label for="position" class="visually-hidden">Cargo</label>
              <input type="text" id="position" name="position" placeholder="Cargo (*)" required />
            </div>

            <div class="form-group hidden" id="person-type-container">
              <label for="person-type" class="visually-hidden">Tipo de persona</label>
              <select id="person-type" name="person-type">
                <option value="">Cargando...</option>
              </select>
            </div>

          </div>

          <div class="names" id="names-container">

            <div class="form-group">
              <label for="first-name" class="visually-hidden">Nombres</label>
              <input type="text" id="first-name" name="first-name" placeholder="Nombres (*)" required />
            </div>

            <div class="form-group">
              <label for="last-name" class="visually-hidden">Apellidos</label>
              <input type="text" id="last-name" name="last-name" placeholder="Apellidos (*)" required />
            </div>

          </div>

          <div class="form-group hidden" id="razon-social-container">
            <label for="razon-social" class="visually-hidden">Razón Social</label>
            <input type="text" id="razon-social" name="razon-social" placeholder="Razón Social (*)" />
          </div>

          <div class="form-group">
            <label for="email" class="visually-hidden">Email</label>
            <input type="email" id="email" name="email" placeholder="Email(*)" required />
          </div>

          <div class="document">

            <div class="form-group">
              <label for="document-type" class="visually-hidden">Tipo de documento</label>
              <select id="document-type" name="document-type" required>
                <option value="">Selecione tipo de documento </option>
              </select>
            </div>

            <div class="form-group">
              <label for="document-number" class="visually-hidden">número de documento</label>
              <input type="text" id="document-number" name="document-number" placeholder="número de documento(*)"
                required />
            </div>

          </div>
          <div class="pass">

            <div class="form-group">
              <label for="password" class="visually-hidden">Contraseña</label>
              <input type="password" id="password" name="password" placeholder="Contraseña(*)" required
                autocomplete="new-password" />
              <!-- Lista de requisitos dinámica -->
              <div id="password-requirements" class="password-requirements hidden">
                <p id="req-length" class="req-item invalid"><i class="fas fa-times-circle"></i> Mínimo 8 caracteres</p>
                <p id="req-upper" class="req-item invalid"><i class="fas fa-times-circle"></i> Al menos una mayúscula
                </p>
                <p id="req-number" class="req-item invalid"><i class="fas fa-times-circle"></i> Al menos un número</p>
                <p id="req-symbol" class="req-item invalid"><i class="fas fa-times-circle"></i> Al menos un símbolo
                  (@$!%*?&._-)</p>
              </div>
            </div>

            <div class="form-group">
              <label for="confirm-password" class="visually-hidden">Confirmar contraseña</label>
              <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirmar contraseña(*)"
                required />
            </div>

          </div>

          <div class="form-buttons">
            <button type="submit" class="btn">Registrar</button>
            <button type="reset" class="btn">Limpiar</button>
          </div>
        </form>
      </section>

    </main>


  </div>

  <script src="../js/config.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/user_new.js"></script>
</body>

</html>
