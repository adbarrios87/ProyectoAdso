<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Parere GRC - Lista de usuarios </title>
  <link href="../css/template.css" rel="stylesheet">
  <link href="../css/user_list.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>

<body>

  <nav class="sidebar">
    <div class="logo-container">
      <a href="#" id="logo-link">
        <img src="../assets/parere_sin_fondo.png" alt="Parere GRC Logo" class="logo">
      </a>
    </div>
    <ul class="menu"></ul>
    <ul class="bottom-menu"></ul>
  </nav>
  <div class="content">

    <main class="main-container">
      <h2 class="section-title">Gestión de Usuarios</h2>

      <div class="table-header">
        <div class="search-input-group">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Buscar usuarios..." oninput="filtrarUsuarios()">
        </div>
        <button class="btn"><a href="user_new.html">Nuevo usuario</a></button>
      </div>

      <div class="table-container">
        <table class="general-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Rol</th>
              <th>Correo</th>
              <th>Estado</th>
              <th>Último acceso</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="userTableBody">

          </tbody>
        </table>
      </div>

      <!-- Modal Editar Usuario -->
      <div id="editUserModal" class="modal-overlay">
        <div class="modal-content">
          <span class="close-modal">&times;</span>
          <h2>Editar Usuario</h2>
          <form class="edit-user-form">

            <div class="form-group">
              <label for="edit-role">Rol del Usuario</label>
              <select id="edit-role" name="edit-role" required>
                <option value="">Seleccionar nuevo rol</option>
              </select>
            </div>

            <div class="form-group">
              <label for="edit-status">Estado de la Cuenta</label>
              <select id="edit-status" name="edit-status" required>
                <option value="activo">Activo</option>
                <option value="inactivo">Inactivo</option>
              </select>
            </div>

            <div class="form-group">
              <label for="edit-password">Nueva Contraseña (Opcional)</label>
              <input type="password" id="edit-password" name="edit-password" placeholder="Ingresa nueva contraseña si deseas cambiarla">
              
              <!-- Panel de Requisitos (Sincronizado con JS) -->
              <div id="password-requirements" class="password-requirements hidden">
                <p id="req-length" class="req-item invalid"><i class="fa-solid fa-circle-xmark"></i> Mínimo 8 caracteres</p>
                <p id="req-upper" class="req-item invalid"><i class="fa-solid fa-circle-xmark"></i> Al menos una mayúscula</p>
                <p id="req-number" class="req-item invalid"><i class="fa-solid fa-circle-xmark"></i> Al menos un número</p>
                <p id="req-symbol" class="req-item invalid"><i class="fa-solid fa-circle-xmark"></i> Al menos un símbolo (@$!%*?&._-)</p>
              </div>
            </div>

            <div class="form-buttons">
              <button type="submit" class="btn">Guardar cambios</button>
              <button type="button" class="btn btn-cancel">Cancelar</button>
            </div>
          </form>
        </div>
      </div>

    </main>

  </div>

  <script src="../js/config.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/user_list.js"></script>
</body>

</html>
