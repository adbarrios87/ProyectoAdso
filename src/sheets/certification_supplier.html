<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Perfil del proveedor</title> <!--Cambiar el titulo aqui según la pagina-->
  <link href="../css/template.css" rel="stylesheet">
  <link href="../css/certification_supplier.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
/>
</head>
<body>
  
  <nav class="sidebar"> <!-- Aquí la navegación principal -->
    <div class="logo-container">
      <img src="../assets/logo_golden.png" alt="Golden Logo" class="logo">
    </div>
     <ul class="menu">
        <li><a class="fa-solid fa-house"></a>Inicio</li>
        <li><a class="fa-solid fa-users"></a>Usuarios</li>
        <li><a class="fa-solid fa-building-user"></a>Proveedores</li>
        <li><a class="fa-solid fa-triangle-exclamation"></a>Riesgo</li>
        <li><a class="fa-solid fa-star-half-stroke"></a>Evaluación</li>
        <li><a class="fa-solid fa-chart-column"></a>Reportes</li>
        <li><a class="fa-solid fa-bell"></a>Notificaciones</li>
        <li><a class="fa-solid fa-gear"></a>Configuración</li>
      </ul>

      <ul class="bottom-menu">
        <li><a class="fa-solid fa-right-from-bracket"></a>Salida</li>
        <li><a class="fa-solid fa-circle-question"></a>Ayuda</li>
      </ul>   
  </nav>
<div class="content">

  <header class="user-section">
      <div class="user-info">
        <span class="user-name">C.R CAFETO</span>
        <span class="user-role"><i class="fa-solid fa-user-shield"></i> Proveedor</span>
      </div>
      <img src="https://randomuser.me/api/portraits/women/75.jpg" alt="Foto de usuario" class="user-img" />
  </header>

  <main class="certification-container">
  <h2>Generar certificación comercial</h2>
  <form id="certificationForm" class="certification-form">
    
    <div class="form-group">
      <label for="recipient">A quién va dirigida</label>
      <input type="text" id="recipient" name="recipient" placeholder="Ejemplo: A la empresa Compras Globales S.A.S" required>
    </div>

   
    <div class="form-group checkbox-group">
      <input type="checkbox" id="includeRating" name="includeRating">
      <label for="includeRating">Incluir última calificación</label>
    </div>

    <div class="form-actions">
      <button type="button" class="btn" id="generatePDF">Generar certificación</button>
    </div>
  </form>
</main>

   <footer>
    <p>Copyright © 2025 Juan Cadena, Adriana Barrios</p>
  </footer>
</div>

</body>
</html>
