<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Golden olds - Login</title>
  <link href="src/css/login.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="src/assets/logo_golden.png" alt="Golden Logo" class="logo">
    </div>
  </header>

  <main>
    <div class="image-container">
      <img src="src/assets/fondo-almacen.jpg" alt="Imagen de gestión ">
    </div>

    <div class="right-column">
      <div class="login-box">
        <h2>Iniciar Sesión</h2>
        <form>
          <label for="usuario">Nombre de usuario:</label>
          <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario">

          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña">

          <div class="options">
            <label><input type="checkbox"> Recordarme</label>
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>
<!-- Botones de prueba para iniciar sesión con diferentes roles  temporal mientras se implementa el backend-->
 
          <button><a href="src/sheets/admin_dashboard.html">Iniciar sesión Administrador</a></button>
          <button><a href="src/sheets/buyer_supplier_list.html">Iniciar sesión Comprador</a></button>
          <button><a href="src/sheets/supplier_dashboard.html">Iniciar sesión Proveedor</a></button>
        </form>
      </div>

      <footer class="finicial">
        <p>Copyright © 2025 Juan Cadena, Adriana Barrios</p>
      </footer>
    </div>
  </main>
</body>
</html>
