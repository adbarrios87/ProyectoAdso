<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Parere GRC - Login</title>
  <link href="Frontend/css/login.css" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>
  <div class="login-container">
    <!-- Lado izquierdo: Branding -->
    <div class="left-side">
      <div class="brand-content">
        <img src="Frontend/assets/parere_sin_fondo.png" alt="Parere GRC Logo" class="brand-logo">
        <p class="tagline">Validación Ética de Proveedores</p>
        <div class="brand-features">
          <div class="feature"><i class="fa-solid fa-shield-halved"></i><span>Gestión de Riesgo</span></div>
          <div class="feature"><i class="fa-solid fa-scale-balanced"></i><span>Cumplimiento Normativo</span></div>
          <div class="feature"><i class="fa-solid fa-check-double"></i><span>Validación Integral</span></div>
        </div>
      </div>
      <div class="brand-footer">
        <p>© 2025 Juan Cadena, Adriana Barrios</p>
      </div>
    </div>

    <!-- Lado derecho: Formulario -->
    <div class="right-side">
      <div class="login-card">
        <div class="login-header">
          <h2>Bienvenido</h2>
          <p>Ingresa tus credenciales para continuar</p>
        </div>
        <form onsubmit="event.preventDefault(); simularLogin();">
          <div class="input-group">
            <label for="usuario">Correo Electrónico</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-envelope"></i>
              <input type="email" id="usuario" name="usuario" placeholder="Escribe tu correo electrónico">
            </div>
          </div>
          <div class="input-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="password" name="password" placeholder="Escribe tu contraseña">
            </div>
          </div>
          <div class="options-row">
            <label class="checkbox-label">
              <input type="checkbox">
              <span class="checkmark"></span>
              Recordarme
            </label>
            <a href="Frontend/sheets/password_recovery.html" class="forgot-link">¿Olvidaste tu contraseña?</a>
          </div>
          <button type="submit" class="btn-login">
            <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
          </button>
          <!-- La pista de pruebas ha sido eliminada ya que ahora usamos la BD real -->
      </div>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- INICIO DEL BLOQUE DE CONEXION AL BACKEND -->
  <!-- ========================================================================= -->
  <script src="Frontend/js/config.js"></script>
  <script src="Frontend/js/login.js"></script>
  <!-- ========================================================================= -->
  <!-- FIN DEL BLOQUE DE CONEXION -->
  <!-- ========================================================================= -->
</body>

</html>
