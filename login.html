<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Parere GRC - Login</title>
  <link href="src/css/login.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>
  <div class="login-container">
    <!-- Lado izquierdo: Branding -->
    <div class="left-side">
      <div class="brand-content">
        <img src="src/assets/parere_sin_fondo.png" alt="Parere GRC Logo" class="brand-logo">
        <p class="tagline">Validación Ética de Proveedores</p>
        <div class="brand-features">
          <div class="feature"><i class="fa-solid fa-shield-halved"></i><span>Gestión de Riesgo</span></div>
          <div class="feature"><i class="fa-solid fa-scale-balanced"></i><span>Cumplimiento Normativo</span></div>
          <div class="feature"><i class="fa-solid fa-check-double"></i><span>Validación Integral</span></div>
        </div>
      </div>
      <div class="brand-footer">
        <p>© 2025 Juan Cadena, Adriana Barrios</p>
      </div>
    </div>

    <!-- Lado derecho: Formulario -->
    <div class="right-side">
      <div class="login-card">
        <div class="login-header">
          <h2>Bienvenido</h2>
          <p>Ingresa tus credenciales para continuar</p>
        </div>
        <form onsubmit="event.preventDefault(); simularLogin();">
          <div class="input-group">
            <label for="usuario">Usuario</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user"></i>
              <input type="text" id="usuario" name="usuario" placeholder="Escribe tu usuario">
            </div>
          </div>
          <div class="input-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="password" name="password" placeholder="Escribe tu contraseña">
            </div>
          </div>
          <div class="options-row">
            <label class="checkbox-label">
              <input type="checkbox">
              <span class="checkmark"></span>
              Recordarme
            </label>
            <a href="src/sheets/password_recovery.html" class="forgot-link">¿Olvidaste tu contraseña?</a>
          </div>
          <button type="submit" class="btn-login">
            <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
          </button>
        </form>
        <div class="login-hint">
          <p><i class="fa-solid fa-circle-info"></i> Prueba: <strong>admin</strong>, <strong>proveedor</strong>, <strong>cumplimiento</strong>, <strong>riesgo</strong> o <strong>comprador</strong></p>
        </div>
      </div>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- INICIO DEL BLOQUE TEMPORAL PARA SIMULAR USUARIOS -->
  <!-- ESTE BLOQUE ES EL QUE DEBES ELIMINAR CUANDO CONECTES LA BASE DE DATOS -->
  <!-- ========================================================================= -->
  <script>
    // Cada vez que entramos al login, limpiamos la sesión anterior por seguridad
    localStorage.removeItem('userRole');
    localStorage.removeItem('userName');

    function simularLogin() {
      // Tomamos el usuario que se escribió y lo pasamos a minúsculas
      const usuarioIngresado = document.getElementById('usuario').value.trim().toLowerCase();
      let role = '';
      let nextPage = '';

      // Asignar rol según la palabra clave que escriban
      // Se usan incluye ('riesgo', 'admin', etc) para que sea más flexible al escribir
      if (usuarioIngresado.includes('riesgo')) {
        role = 'analista';
        nextPage = 'src/sheets/risk_dashboard.html';
      } else if (usuarioIngresado.includes('cumplimiento')) {
        role = 'oficial';
        nextPage = 'src/sheets/compliance_officer_dashboard.html';
      } else if (usuarioIngresado.includes('admin')) {
        role = 'admin';
        nextPage = 'src/sheets/admin_dashboard.html';
      } else if (usuarioIngresado.includes('proveedor')) {
        role = 'proveedor'; //ok
        nextPage = 'src/sheets/supplier_dashboard.html'; 
      } else if (usuarioIngresado.includes('comprador')) {
        role = 'comprador';
        nextPage = 'src/sheets/buyer_dashboard.html';
      } else {
        alert("Usuario no válido para pruebas. Escribe algo como: 'admin', 'proveedor', 'riesgo', 'cumplimiento' o 'comprador'.");
        return; // Detener el login si se equivocaron
      }

      // Guardar el rol y nombre temporalmente en el navegador
      localStorage.setItem('userRole', role);
      localStorage.setItem('userName', document.getElementById('usuario').value.trim() || 'Usuario');

      // Ir a la página que le toca
      window.location.href = nextPage;
    }
  </script>
  <!-- ========================================================================= -->
  <!-- FIN DEL BLOQUE TEMPORAL -->
  <!-- ========================================================================= -->
</body>

</html>
