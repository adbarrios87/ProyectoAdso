<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Parere GRC - Login</title>
  <link href="src/css/login.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>
  <div class="login-container">
    <!-- Lado izquierdo: Branding -->
    <div class="left-side">
      <div class="brand-content">
        <img src="src/assets/parere_sin_fondo.png" alt="Parere GRC Logo" class="brand-logo">
        <p class="tagline">Validación Ética de Proveedores</p>
        <div class="brand-features">
          <div class="feature"><i class="fa-solid fa-shield-halved"></i><span>Gestión de Riesgo</span></div>
          <div class="feature"><i class="fa-solid fa-scale-balanced"></i><span>Cumplimiento Normativo</span></div>
          <div class="feature"><i class="fa-solid fa-check-double"></i><span>Validación Integral</span></div>
        </div>
      </div>
      <div class="brand-footer">
        <p>© 2025 Juan Cadena, Adriana Barrios</p>
      </div>
    </div>

    <!-- Lado derecho: Formulario -->
    <div class="right-side">
      <div class="login-card">
        <div class="login-header">
          <h2>Bienvenido</h2>
          <p>Ingresa tus credenciales para continuar</p>
        </div>
        <form onsubmit="event.preventDefault(); simularLogin();">
          <div class="input-group">
            <label for="usuario">Usuario</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user"></i>
              <input type="text" id="usuario" name="usuario" placeholder="Escribe tu usuario">
            </div>
          </div>
          <div class="input-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="password" name="password" placeholder="Escribe tu contraseña">
            </div>
          </div>
          <div class="options-row">
            <label class="checkbox-label">
              <input type="checkbox">
              <span class="checkmark"></span>
              Recordarme
            </label>
            <a href="src/sheets/password_recovery.html" class="forgot-link">¿Olvidaste tu contraseña?</a>
          </div>
          <button type="submit" class="btn-login">
            <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
          </button>
        <!-- La pista de pruebas ha sido eliminada ya que ahora usamos la BD real -->
      </div>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- INICIO DEL BLOQUE DE CONEXION AL BACKEND -->
  <!-- ========================================================================= -->
  <script>
    // Limpiamos sesión por seguridad
    localStorage.removeItem('userRole');
    localStorage.removeItem('userName');
    localStorage.removeItem('userEmail');

    async function simularLogin() {
      const usuario = document.getElementById('usuario').value.trim();
      const contrasena = document.getElementById('password').value.trim();

      if (!usuario || !contrasena) {
        alert("Por favor, ingresa tu usuario y contraseña.");
        return;
      }

      try {
        const response = await fetch('http://localhost:8080/usuarios/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, contrasena })
        });

        const result = await response.json();

        if (result.data && result.data.successful) {
          const userData = result.data;
          
          // Lógica de redirección y asignación de nombre de rol según ID
          let nextPage = '';
          let roleString = '';
          
          switch (userData.idRol) {
            case 1: // Admin
              roleString = 'admin';
              nextPage = 'src/sheets/admin_dashboard.html';
              break;
            case 2: // Proveedor
              roleString = 'proveedor';
              nextPage = 'src/sheets/supplier_dashboard.html';
              break;
            case 3: // Comprador
              roleString = 'comprador';
              nextPage = 'src/sheets/buyer_dashboard.html';
              break;
            case 4: // Analista de Riesgo
              roleString = 'analista';
              nextPage = 'src/sheets/risk_dashboard.html';
              break;
            case 5: // Oficial de Cumplimiento
              roleString = 'oficial';
              nextPage = 'src/sheets/compliance_officer_dashboard.html';
              break;
            default:
              roleString = 'admin';
              nextPage = 'src/sheets/admin_dashboard.html';
          }

          // Guardar información real en el navegador (usamos roleString para no romper el main.js)
          localStorage.setItem('userRole', roleString);
          localStorage.setItem('userName', userData.nombreUsuario);
          localStorage.setItem('userEmail', userData.correoUsuario);
          localStorage.setItem('userId', userData.idUsuario);
          
          // Guardar la foto de perfil (si no tiene, guardamos un string vacío)
          localStorage.setItem('userPhoto', userData.fotoUrl || '');

          window.location.href = nextPage;
        } else {
          alert("Error: " + (result.data ? result.data.message : "Usuario o contraseña incorrectos"));
        }
      } catch (error) {
        console.error("Error al conectar con el servidor:", error);
        alert("No se pudo conectar con el servidor. Verifica que el Backend esté encendido en IntelliJ.");
      }
    }
  </script>
  <!-- ========================================================================= -->
  <!-- FIN DEL BLOQUE DE CONEXION -->
  <!-- ========================================================================= -->
</body>

</html>
